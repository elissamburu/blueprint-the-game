# Categorías de servicios (RF-CAT-02, docs/03 §6). Alineadas con las carpetas de íconos de
# servicio (Architecture-Service-Icons/Arch_<Categoría>) del paquete oficial de íconos de
# arquitectura de AWS, release 07/31/2026. El id es el nombre de la carpeta en kebab-case.
#
# `adjacent`: categorías que se suman a la paleta en el modo categories-plus (nivel 300).
# Son relaciones de diseño frecuentes, no una jerarquía; revisarlas con las métricas de juego.
#
# `kind`: `service` (default) o `concept`. Las categorías de conceptos (ADR-0027 §1) son la
# única excepción a la alineación con el paquete de íconos: llevan el prefijo `concept-` para
# no chocar con las de servicios y no tienen adyacencias.

