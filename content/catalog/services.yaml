# SPDX-License-Identifier: CC-BY-NC-SA-4.0
# Catálogo curado de servicios (RF-CAT-01, ADR-0011, docs/03 §4).
#
# - `id` es estable: lo usan los escenarios. No se renombra; si un servicio se retira, pasa a
#   `status: deprecated`.
# - `category`: id de catalog/categories.yaml, igual a la carpeta del paquete de íconos.
# - `icon`: nombre base del archivo en el paquete oficial de íconos de arquitectura de AWS
#   (release 07/31/2026), sin tamaño de carpeta ni extensión. Los íconos no se versionan en el
#   repo (ADR-0012). Los balanceadores usan íconos de recurso (Res_…) porque el paquete solo
#   trae un ícono de servicio genérico para Elastic Load Balancing.
# - `leakPatterns`: textos que delatan al servicio (lint L005). Para nombres que son palabras
#   comunes (Config, Glue, Batch, Shield, Backup…) se usan patrones compuestos.
# - `ssmNamespaces`: TODO(verificar). Los namespaces de /aws/service/global-infrastructure/services
#   no se consultaron (sin credenciales de AWS al crear el catálogo); los completa el proceso
#   de catalog-sync (ADR-0011) con revisión humana.
# - `since`, `whenToUse` y `whenNotToUse` se completan más adelante, con fuente.

