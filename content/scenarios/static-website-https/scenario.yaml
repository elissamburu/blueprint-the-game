# yaml-language-server: $schema=../../../packages/scenario-schema/dist/scenario.schema.json
schemaVersion: 1
id: static-website-https
version: 1
status: beta
lang: es
level: 100
areas: [networking, storage]
title: "El sitio institucional de una ONG, seguro y rápido en todo el mundo"
summary: "Un sitio estático con dominio propio y HTTPS, para visitantes de todo el mundo, sin servidores y al menor costo posible."
estimatedMinutes: 5
authors:
  - github: elissamburu

context: |
  Una **ONG** tiene un sitio institucional hecho solo con archivos estáticos: páginas HTML,
  hojas de estilo, imágenes y algunos PDF. No hay formularios ni base de datos.

  El sitio tiene que abrirse con el **dominio propio** de la organización (con y sin `www`)
  y siempre por **HTTPS**. Lo visitan donantes y voluntarios de **todo el mundo**.

  La ONG no tiene equipo de sistemas: una persona de comunicación sube los archivos nuevos
  cada tanto. El presupuesto es mínimo y el tráfico, bajo.

objectives:
  - id: no-servers
    kind: hard
    category: operations
    text: "Nadie en la organización puede administrar servidores, sistemas operativos ni parches."
  - id: https-own-domain
    kind: hard
    category: security
    text: "El sitio se sirve solo por HTTPS y con el dominio propio de la organización, también sin www."
  - id: global-audience
    kind: soft
    category: latency
    text: "Visitantes de todo el mundo: la página tiene que cargar rápido aunque estén lejos de donde se guardan los archivos."
  - id: low-cost
    kind: soft
    category: cost
    text: "Costo mínimo: con poco tráfico, pagar por uso y no por capacidad reservada."

diagram:
  canvas: { width: 1400, height: 700 }
  groups:
    - id: cloud
      kind: aws-cloud
      label: "Nube"
      rect: { x: 220, y: 60, w: 1140, h: 600 }
      parent: null

  nodes:
    - id: visitors
      type: actor
      label: "Visitantes"
      icon: users
      position: { x: 40, y: 320 }

    - id: editor
      type: actor
      label: "Responsable de comunicación"
      icon: user
      position: { x: 40, y: 520 }

    - id: dns
      type: slot
      role: "Servicio que resuelve el dominio propio, incluso sin www, hacia la red que entrega el sitio."
      position: { x: 320, y: 120 }
      group: cloud
      answers:
        - service: route53
          grade: optimal
          objectives: [https-own-domain, low-cost, no-servers]
          rationale: >
            DNS administrado que permite un registro de tipo alias tanto para el dominio raíz
            (sin www) como para subdominios, algo que un CNAME no permite en la raíz. Las
            consultas alias hacia la red de distribución no tienen cargo.
          references:
            - https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-to-cloudfront-distribution.html
      incorrect:
        - service: global-accelerator
          rationale: "Da direcciones IP estáticas que dirigen tráfico hacia balanceadores o instancias; no aloja los registros DNS del dominio."
      hints:
        - "Alguien tiene que traducir el nombre del dominio a una dirección."
        - "Buscá un servicio de DNS que pueda apuntar el dominio raíz (sin www) a un recurso de AWS."

    - id: certificate
      type: slot
      role: "Emisión y renovación del certificado TLS del dominio propio que se presenta a los visitantes."
      position: { x: 620, y: 100 }
      group: cloud
      answers:
        - service: acm
          grade: optimal
          objectives: [https-own-domain, low-cost, no-servers]
          rationale: >
            Emite certificados públicos sin costo para usarlos con servicios integrados y los
            renueva automáticamente. Para usarlo con la red de distribución, el certificado se
            pide en la región US East (N. Virginia), us-east-1.
          references:
            - https://aws.amazon.com/certificate-manager/pricing/
            - https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html
            - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html
      incorrect:
        - service: kms
          rationale: "Crea y controla claves para cifrar datos; no emite certificados TLS para un dominio."
        - service: secrets-manager
          rationale: "Guarda y rota secretos de aplicaciones, como contraseñas o claves de API; no emite ni renueva certificados TLS públicos."
      hints:
        - "Para HTTPS con tu dominio necesitás un certificado firmado por una autoridad reconocida."
        - "Buscá un servicio que emita certificados públicos y los renueve solo."

    - id: edge
      type: slot
      role: "Red global que recibe los pedidos HTTPS en ubicaciones cercanas a cada visitante y guarda copias del sitio en caché."
      position: { x: 620, y: 320 }
      group: cloud
      answers:
        - service: cloudfront
          grade: optimal
          objectives: [global-audience, https-own-domain, no-servers, low-cost]
          rationale: >
            Red de entrega de contenido: cada visitante es atendido desde la ubicación de borde
            con menor latencia, que guarda copias en caché. Acepta el dominio propio como nombre
            alternativo con su certificado y fuerza HTTPS. Cobra por transferencia y pedidos, y
            la transferencia desde el almacenamiento hacia ella no tiene cargo.
          references:
            - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
            - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html
      incorrect:
        - service: alb
          rationale: "Reparte pedidos entre instancias, direcciones IP o funciones dentro de una región: no guarda copias cerca de los visitantes ni puede usar el almacenamiento de objetos como destino."
        - service: global-accelerator
          rationale: "Acerca el tráfico por la red de AWS, pero sus destinos son balanceadores, instancias o IP elásticas: no sirve archivos de un almacenamiento de objetos ni guarda copias en caché."
      hints:
        - "Buscá algo que guarde copias del sitio cerca de cada visitante."
        - "Es una red de entrega de contenido (CDN)."

    - id: site-store
      type: slot
      role: "Almacenamiento privado y durable de los archivos del sitio: HTML, CSS, imágenes y PDF."
      position: { x: 960, y: 420 }
      group: cloud
      answers:
        - service: s3
          grade: optimal
          objectives: [no-servers, low-cost]
          rationale: >
            Almacenamiento de objetos sin servidores, que cobra por lo guardado y lo transferido.
            El bucket puede quedar privado: solo la red de distribución lo lee, con control de
            acceso al origen. Servido directamente como sitio web no soporta HTTPS, por eso va
            detrás de la red de distribución.
          references:
            - https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteEndpoints.html
            - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html
            - https://aws.amazon.com/s3/pricing/
      incorrect:
        - service: ec2
          violates: [no-servers]
          rationale: "Podrías montar un servidor web, pero alguien tendría que administrar el sistema operativo, los parches y la disponibilidad."
        - service: ebs
          violates: [no-servers]
          rationale: "Es un disco en bloque que se conecta a una instancia: para servir el sitio necesitarías un servidor."
        - service: efs
          violates: [no-servers]
          rationale: "Es un sistema de archivos que se monta desde cómputo: para servir los archivos por HTTP necesitarías un servidor."
      hints:
        - "Los archivos del sitio son objetos: se suben y se leen enteros."

  edges:
    - { id: e1, from: editor,   to: site-store,  step: 1, style: data,    label: "Sube los archivos nuevos" }
    - { id: e2, from: visitors, to: dns,         step: 2, style: sync,    label: "Resuelve el dominio" }
    - { id: e3, from: visitors, to: edge,        step: 3, style: sync,    label: "Pide la página por HTTPS" }
    - { id: e4, from: edge,     to: certificate, step: 4, style: control, label: "Presenta el certificado",
        description: "El visitante verifica que el certificado corresponde al dominio de la organización." }
    - { id: e5, from: edge,     to: site-store,  step: 5, style: data,    label: "Pide lo que no está en caché",
        description: "Solo la red de distribución puede leer el almacenamiento; el resto de los pedidos se resuelve desde la caché." }

palette:
  mode: auto
