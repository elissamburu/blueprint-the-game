packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  - "tools/*"

# esbuild (via tsx) ships its binary in an optional platform package: its install script
# is not needed, so it stays denied.
allowBuilds:
  esbuild: false

# Shared versions for tooling and for the libraries more than one package uses, which must
# resolve to a single copy (one React context, one i18next instance) (`"catalog:"` in package.json).
catalog:
  "@dnd-kit/core": ^6.3.1
  "@eslint/js": ^10.0.1
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/react": ^16.3.3
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  "@vitest/coverage-v8": ^5.0.3
  axe-core: ^4.14.0
  dependency-cruiser: ^18.5.0
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.13.0
  i18next: ^26.4.3
  jsdom: ^30.1.2
  lucide-react: ^1.55.0
  prettier: ^3.9.10
  react: ^19.3.0
  react-dom: ^19.3.0
  react-i18next: ^17.0.16
  react-router: ^8.4.0
  rimraf: ^6.1.3
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  turbo: ^2.11.7
  typescript: ~6.0.3
  typescript-eslint: ^8.71.1
  vite: ^8.3.4
  vitest: ^5.0.3
  yaml: ^2.9.1
  zod: ^4.6.5
  zustand: ^5.0.15
