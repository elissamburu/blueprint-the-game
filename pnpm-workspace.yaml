packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  - "tools/*"

# esbuild (via tsx) ships its binary in an optional platform package: its install script
# is not needed, so it stays denied.
allowBuilds:
  esbuild: false

# Shared versions for tooling used across packages (`"catalog:"` in package.json).
catalog:
  "@eslint/js": ^10.0.1
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/react": ^16.3.3
  "@types/node": ^26.6.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  "@vitest/coverage-v8": ^5.0.2
  axe-core: ^4.13.0
  dependency-cruiser: ^18.4.0
  eslint: ^10.11.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.12.0
  jsdom: ^30.1.1
  lucide-react: ^1.48.0
  prettier: ^3.9.9
  react: ^19.3.0
  react-dom: ^19.3.0
  rimraf: ^6.1.3
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  turbo: ^2.11.4
  typescript: ~6.0.3
  typescript-eslint: ^8.70.1
  vite: ^8.3.1
  vitest: ^5.0.2
  yaml: ^2.9.1
  zod: ^4.6.5
