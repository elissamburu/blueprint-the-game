# Game rules of the e2e fixture bundle. Same scoring as content/game-rules.yaml; the rank
# thresholds and the unlock requirement are low so that a single scenario is enough to go up a
# rank and open the next level (DoD of F1). The specs assert these numbers.
scoring:
  firstTryGreen: 100
  greenAfterErrors:
    penaltyPerError: 25
    min: 25
  acceptedAcceptable: 50
  hintCost: 15
  revealedSolution: 0
levelMultipliers: { 0: 0.5, 100: 1, 200: 1.5, 300: 2, 400: 3 }
ranks:
  - { id: aprendiz, name: Aprendiz, minXp: 0 }
  - { id: constructor, name: Constructor, minXp: 200 }
  - { id: arquitecto, name: Arquitecto, minXp: 2000 }
unlock:
  scenariosRequired: 1
  byExperience:
    newcomer: [0]
    beginner: [0, 100]
    aws-user: [0, 100, 200]
    architect: [0, 100, 200, 300]
    expert: [0, 100, 200, 300, 400]
palette:
  modeByLevel: { 0: curated, 100: curated, 200: categories, 300: categories-plus, 400: full }
  defaultMaxSize: 12
  maxSizeByLevel: { 0: 8 }
