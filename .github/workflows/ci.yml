name: CI

# Runs untrusted code from forks: never use pull_request_target here (ADR-0015).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check package boundaries
        run: pnpm deps:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Official AWS Architecture Icons (ADR-0012): a public download, no AWS credentials. The
      # zip is cached by the config that pins its URL and SHA-256; icons:fetch verifies the hash
      # of the cached copy too.
      - name: Cache AWS icons package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/aws-icons
          key: aws-icons-${{ hashFiles('tools/icons-fetch/icons.config.json') }}

      - name: Fetch AWS icons
        run: pnpm icons:fetch

      - name: Build
        run: pnpm build

      # RNF-03: initial JS of the game under 250 KB gzip (reads the Vite manifest of the build).
      - name: Check web bundle size
        run: pnpm --filter @blueprint/web size

      # L014 compares each scenario's version against the PR base branch. The checkout is
      # shallow and only has the PR merge commit, so fetch the base ref explicitly.
      - name: Fetch PR base branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Validate content (against PR base)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm --reporter=silent content:validate --base "origin/${BASE_REF}"

      - name: Validate content
        if: github.event_name != 'pull_request'
        run: pnpm --reporter=silent content:validate

      - name: Check generated content files
        run: pnpm content:gen --check

  # End-to-end tests in a real browser (Playwright + axe; DoD of F1, docs/accesibilidad.md §7).
  # Like `checks`, it runs the PR code without credentials. Ubuntu only: the suite drives
  # Chromium, which behaves the same on both systems.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same cache as `checks`: the game is tested with the official icons.
      - name: Cache AWS icons package
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/aws-icons
          key: aws-icons-${{ hashFiles('tools/icons-fetch/icons.config.json') }}

      - name: Fetch AWS icons
        run: pnpm icons:fetch

      # The browser build is tied to the Playwright version, so that is the cache key. The system
      # libraries are not cached: on a hit only they are installed.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @blueprint/web exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @blueprint/web exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @blueprint/web exec playwright install-deps chromium

      # Builds the content bundles and the web, then starts the servers from the Playwright config.
      # The output is kept for the summary of the job (`shell: bash` runs with pipefail).
      - name: Run end-to-end tests
        shell: bash
        run: pnpm e2e 2>&1 | tee "$RUNNER_TEMP/e2e-web.log"

      # Scenario Studio (ADR-0025): a Playwright project of its own, against `pnpm studio` over a
      # temporary copy of content/. Builds the Studio UI first.
      - name: Run Studio end-to-end tests
        shell: bash
        run: pnpm e2e:studio 2>&1 | tee "$RUNNER_TEMP/e2e-studio.log"

      # The failed and flaky tests of each suite (flaky: failed, then passed on the retry), from the
      # final summary of the list reporter. A flaky test leaves the job green, so it also uploads
      # the report: the HTML report keeps the failed attempt and its trace (#66).
      - name: Summarize Playwright results
        id: playwright-summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          flaky=false
          {
            echo "## Pruebas end-to-end"
            for suite in web studio; do
              echo "### \`$suite\`"
              log="$RUNNER_TEMP/e2e-$suite.log"
              if [ ! -f "$log" ]; then
                echo "No corrió."
                continue
              fi
              results=$(sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' "$log" | awk '
                /^  [0-9]+ (failed|flaky|interrupted)$/ { keep = 1; print; next }
                keep && /^    [^ ]/ { print; next }
                { keep = 0 }
                /^  [0-9]+ (passed|skipped|did not run)/ { print }
              ' | awk '!seen[$0]++')
              if grep -qE '^  [0-9]+ flaky$' <<< "$results"; then flaky=true; fi
              if [ -z "$results" ]; then
                echo "Sin resumen de Playwright: falló antes de correr los tests (ver el log del paso)."
              else
                printf '```text\n%s\n```\n' "$results"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "flaky=$flaky" >> "$GITHUB_OUTPUT"

      - name: Upload Playwright report
        id: playwright-report
        if: failure() || steps.playwright-summary.outputs.flaky == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/studio/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Link the Playwright report in the summary
        if: ${{ !cancelled() && steps.playwright-report.outputs.artifact-url != '' }}
        shell: bash
        env:
          REPORT_URL: ${{ steps.playwright-report.outputs.artifact-url }}
        run: |
          echo "Reporte de Playwright (con los traces de los intentos fallidos): $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

  # Terraform of infra/ (ADR-0014): format, validation and the offline tests (mocked provider), with
  # no backend and no AWS credentials: no id-token here. plan and apply only run in the deploy
  # workflow, behind the GitHub environments.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugins
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same version as required_version in infra/bootstrap/versions.tf, read from there.
      - name: Read Terraform version
        id: terraform-version
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*required_version[[:space:]]*=[[:space:]]*"=[[:space:]]*([0-9.]+)".*/\1/p' infra/bootstrap/versions.tf)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .terraform-plugins
          key: terraform-providers-${{ hashFiles('infra/**/.terraform.lock.hcl') }}

      - name: Check Terraform formatting
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform fmt -check -recursive -diff infra

      # Every root and module of infra/ (each one has a versions.tf). init without backend never
      # reads or writes state; the tests use a mocked provider.
      - name: Validate and test Terraform
        shell: bash
        run: |
          status=0
          while IFS= read -r dir; do
            echo "::group::$dir"
            if terraform -chdir="$dir" init -backend=false -lockfile=readonly \
              && terraform -chdir="$dir" validate \
              && { [ ! -d "$dir/tests" ] || terraform -chdir="$dir" test; }; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::Terraform failed in $dir"
              status=1
            fi
          done < <(find infra -name versions.tf -not -path '*/.terraform/*' -exec dirname {} \; | sort)
          exit "$status"

  # Single stable status check for branch protection, independent of matrix names.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, e2e, terraform]
    if: always()
    steps:
      - name: Verify checks result
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
        run: |
          echo "checks: $CHECKS_RESULT"
          echo "e2e: $E2E_RESULT"
          echo "terraform: $TERRAFORM_RESULT"
          test "$CHECKS_RESULT" = "success"
          test "$E2E_RESULT" = "success"
          test "$TERRAFORM_RESULT" = "success"
